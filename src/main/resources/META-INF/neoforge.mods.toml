license = "CC0-1.0"

modLoader="javafml"
loaderVersion="[1,)"

[[mods]]
modId = "${id}"
displayName = "${name}"
version = "${version}"
authors = "ElectricSteve"
description = "${description}"

logoFile = "assets/bundletweak/icon.png"
displayURL = "https://github.com/electricsteve/bundletweak"
issueTrackerUrl = "https://github.com/electricsteve/bundletweak/issues"

# For newer neoforge versions
iconFile = "assets/bundletweak/icon.png"
bannerFile = "assets/bundletweak/banner.png"

[[mixins]]
config = "bundletweak.mixins.json"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"